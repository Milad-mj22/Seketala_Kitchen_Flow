{% load custom_filters %}
{% load static %}

<body>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/persian.datepicker.css' %}">

<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'js/persian.date.js' %}"></script>
<script src="{% static 'js/persian.datepicker.js' %}"></script>

<style>
    .activity-card {
        border-radius: 12px;
        border: 1px solid #e2e2e2;
        padding: 15px;
        transition: 0.2s ease-in-out;
    }
    .activity-card:hover {
        background: #f8f9fa;
    }
</style>

<script>
$(document).ready(function () {

    // Apply Persian datepicker to ALL date inputs
    function activatePicker(selector) {
        $(selector).persianDatepicker({
            format: 'YYYY/MM/DD',
            autoClose: true,
            initialValue: false
        });
    }

    activatePicker("#start_date");
    activatePicker("#doing_date");
    activatePicker("#follow_date");

    // Convert Jalali → Gregorian before submit
    $("form").on("submit", function () {

        $("[data-gdate]").each(function () {
            let jalali = $(this).val();
            if (jalali) {
                let pd = new persianDate(jalali).toGregorian();
                let gregorian = `${pd.year}-${String(pd.month).padStart(2, "0")}-${String(pd.day).padStart(2, "0")}`;
                $(this).val(gregorian);
            }
        });

    });

});
</script>


{% if factors == None %}

<!-- ------------------------- BUTTON ------------------------- -->
<button class="btn btn-primary mb-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#addActivityModal">
    ➕ افزودن فعالیت
</button>


<!-- ------------------------- ACTIVITY LIST ------------------------- -->
{% for log in logs %}
<div class="activity-card mb-3">
    <div class="text-secondary small">{{ log.timestamp|to_jalali }}</div>
    <div class="fw-bold">{{ log.description }}</div>
</div>
{% empty %}
<p class="text-muted">هیچ فعالیتی ثبت نشده است.</p>
{% endfor %}


<!-- ------------------------- MODAL ADD ACTIVITY ------------------------- -->
<div class="modal fade" id="addActivityModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <form method="POST" action="{% url 'add_buyer_activity' buyer_id %}">
        {% csrf_token %}

        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">➕ افزودن فعالیت جدید</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <!-- نوع فعالیت -->
          <div class="mb-3">
            <label class="form-label fw-bold">نوع فعالیت</label>
            <select name="activity_type" class="form-select" required>
                {% for key in activity_choices %}
                <option value="{{ key }}">{{ key }}</option>
                {% endfor %}
            </select>
          </div>

          <!-- توضیحات -->
          <div class="mb-3">
            <label class="form-label fw-bold">توضیحات</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
          </div>


          <!-- تاریخ‌ها -->
          <div class="row">
            <div class="col-md-4">
                <label class="form-label fw-bold">تاریخ شروع</label>
                <input id="start_date" data-gdate name="start_date" class="form-control" placeholder="انتخاب تاریخ">
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">تاریخ انجام (Doing Date)</label>
                <input id="doing_date" data-gdate name="doing_date" class="form-control" placeholder="انتخاب تاریخ">
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">تاریخ پیگیری (Follow Date)</label>
                <input id="follow_date" data-gdate name="follow_date" class="form-control" placeholder="انتخاب تاریخ">
            </div>
          </div>


          <!-- انتخاب کاربر Mention -->
          <div class="mt-3">
            <label class="form-label fw-bold">منشن کاربران</label>
            <select name="mention_user" class="form-select">
                <option value="">انتخاب کاربر...</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>
          </div>

        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">❌ انصراف</button>
            <button class="btn btn-success">✔ ثبت فعالیت</button>
        </div>

      </form>

    </div>
  </div>
</div>

{% else %}

<!-- your chart + factors part (unchanged) -->

{% endif %}

</body>
