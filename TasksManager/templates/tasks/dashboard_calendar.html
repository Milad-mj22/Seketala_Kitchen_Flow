{% extends "users/base.html" %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet" href="{% static 'css/fullcalendar5.11.3_main.min.css' %}">
<script src="{% static 'js/fullcalendar5.11.3_main.min.js' %}"></script>

<style>
  .tasks-calendar-page {
    min-height: calc(100vh - 80px);
    padding: 2rem 1rem 3rem;
    background: radial-gradient(circle at top left, #1f2937 0, #020617 45%, #020617 100%);
    font-family: "Vazirmatn", sans-serif;
    direction: rtl;
    color: #e5e7eb;
  }

  /* ===== Calendar Card ===== */
  #calendar {
    background: rgba(15, 23, 42, 0.96);
    border-radius: 18px;
    box-shadow:
      0 24px 55px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(148, 163, 184, 0.25);
    padding: 18px;
    margin: 0 auto 2.5rem;
    max-width: 1100px;
  }

  /* FullCalendar tweaks for dark rtl */
  .fc {
    direction: rtl;
  }

  .fc .fc-toolbar.fc-header-toolbar {
    margin-bottom: 1.2rem;
  }

  .fc .fc-toolbar-title {
    color: #f9fafb;
    font-weight: 600;
    font-size: 1.2rem;
  }

  .fc .fc-button-primary {
    background: rgba(30, 64, 175, 0.85);
    border-color: rgba(129, 140, 248, 0.8);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    font-size: 0.8rem;
  }

  .fc .fc-button-primary:hover {
    background: rgba(79, 70, 229, 0.95);
  }

  .fc .fc-col-header-cell-cushion {
    color: #cbd5e1;
    font-size: 0.8rem;
  }

  .fc .fc-daygrid-day-number {
    color: #e5e7eb;
    font-size: 0.78rem;
  }

  .fc .fc-daygrid-day {
    background: rgba(15, 23, 42, 0.9);
    border-color: rgba(30, 64, 175, 0.55);
  }

  .fc .fc-day-today {
    background: rgba(30, 64, 175, 0.45) !important;
  }

  .fc-event {
    font-size: 0.78rem;
    border-radius: 6px;
  }

  /* Limit visible events inside a day cell */
  .fc-daygrid-day-events {
    max-height: calc(3 * 22px); /* حدود ۳ ردیف */
    overflow-y: auto;
  }

  .fc-daygrid-day-events::-webkit-scrollbar {
    width: 6px;
  }
  .fc-daygrid-day-events::-webkit-scrollbar-thumb {
    background-color: rgba(148, 163, 184, 0.6);
    border-radius: 4px;
  }

  /* ===== Modal ===== */
  .modal-content {
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    background: #020617;
    color: #e5e7eb;
  }

  .modal-header {
    border-bottom: 1px solid rgba(148, 163, 184, 0.35);
  }

  .modal-body {
    max-height: 500px;
    overflow-y: auto;
  }

  /* ===== Cards used in modal & undone tasks ===== */
  .tasks-card {
    border: none;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.95);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s ease;
  }

  .tasks-card:hover {
    transform: translateY(-2px);
  }

  .tasks-card .card-title {
    font-size: 0.95rem;
    font-weight: 600;
  }

  textarea.form-control {
    border-radius: 10px;
    resize: none;
    font-size: 0.85rem;
    background: rgba(15, 23, 42, 0.9);
    color: #e5e7eb;
    border-color: rgba(148, 163, 184, 0.7);
  }

  textarea.form-control:focus {
    border-color: #818cf8;
    box-shadow: 0 0 8px rgba(129, 140, 248, 0.7);
  }

  .form-check-label {
    font-weight: 500;
  }

  button.btn-success {
    border-radius: 12px;
    padding: 6px 20px;
    font-size: 0.9rem;
  }

  ul {
    padding-right: 18px; /* برای RTL */
    padding-left: 0;
    margin-top: 5px;
  }

  ul li {
    font-size: 0.85rem;
    color: #cbd5e1;
  }

  a {
    text-decoration: none;
    font-weight: 500;
    color: #38bdf8;
  }

  a:hover {
    color: #0ea5e9;
  }

  /* ===== Undone / Today tasks section ===== */
  .tasks-section-title {
    max-width: 1100px;
    margin: 0 auto;
    color: #e5e7eb;
  }

  #undone-tasks-container {
    max-width: 1100px;
    margin: 1rem auto 0;
  }

  .undone-card {
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(234, 179, 8, 0.6);
    color: #fef9c3;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
  }

  .today-card {
    border-radius: 12px;
    background: rgba(22, 101, 52, 0.9);
    border: 1px solid rgba(74, 222, 128, 0.8);
    color: #dcfce7;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
  }

</style>

<div class="tasks-calendar-page">

  <div id="calendar"></div>

  <!-- Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content text-end">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="taskModalLabel">کارهای این روز</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">بستن</button>
        </div>
      </div>
    </div>
  </div>

  <hr class="text-secondary" style="max-width: 1100px; margin: 2rem auto 1rem;">

  <div class="tasks-section-title">
    <h4 class="mt-2">کارهای انجام‌نشده (به ترتیب تاریخ)</h4>
  </div>
  <div id="undone-tasks-container" class="mt-3"></div>

</div>


<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'fa',
    direction: 'rtl',
    height: 'auto',
    eventDisplay: 'auto',
    dayMaxEvents: false, // بدون لینک +X
    events: (fetchInfo, success, fail) => {
      fetch('/TasksManager/user-tasks/')
        .then(res => res.json())
        .then(data => {
          renderUndoneTasks(data.undone_tasks);
          renderTodayTasks(data.tasks);
          success(data.tasks);
        })
        .catch(err => fail(err));
    },
    dateClick: info => showDayTasks(info.dateStr)
  });

  calendar.render();
});

function showDayTasks(dateStr) {
  fetch('/TasksManager/user-tasks/')
    .then(res => res.json())
    .then(data => {
      const tasks = data.tasks.filter(t => t.start === dateStr);
      document.getElementById('modalBody').innerHTML = tasks.length
        ? tasks.map(task => renderTaskCard(task)).join('')
        : "<p class='text-center text-muted'>هیچ کاری برای این روز وجود ندارد.</p>";

      new bootstrap.Modal(document.getElementById('taskModal')).show();
    });
}

function renderTaskCard(task) {
  const comments = task.comments?.length
    ? `<ul>${task.comments.map(c => `<li>(${c.created_date}) ${c.description} - ${c.created_by}</li>`).join('')}</ul>`
    : `<p class="text-muted">نظری ثبت نشده است.</p>`;

  const buyerHtml = task.buyer?.id
    ? `<a href="/buyers/details/${task.buyer.id}/" target="_blank">${task.buyer.username}</a>`
    : `<span class="text-danger">خریدار ثبت نشده</span>`;

  return `
    <div class="card tasks-card mb-4">
      <div class="card-body">
        <h5 class="card-title">${task.title} - ${buyerHtml}</h5>
        <p class="card-text">تاریخ شروع: ${task.start}</p>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="done-${task.id}" ${task.is_done ? 'checked' : ''}>
          <label class="form-check-label" for="done-${task.id}">انجام شده؟</label>
        </div>
        <div class="mt-3">
          <label for="comment-${task.id}" class="form-label">نظر جدید:</label>
          <textarea class="form-control" id="comment-${task.id}" rows="2" placeholder="نظر خود را وارد کنید..."></textarea>
        </div>
        <div class="mt-3">
          <strong>نظرات ثبت‌شده:</strong>
          ${comments}
        </div>
        <button class="btn btn-success mt-3" onclick="saveTask(${task.id})">ذخیره</button>
      </div>
    </div>
  `;
}

function renderUndoneTasks(tasks) {
  const container = document.getElementById('undone-tasks-container');
  container.innerHTML = tasks.map(task => `
    <div class="card undone-card mb-2">
      <div class="card-body">
        <h5 class="card-title">
          ${task.title}
          ${
            task.buyer
              ? `<a href="/buyers/${task.buyer.id}/" class="ms-2">${task.buyer.username}</a>`
              : '<span class="ms-2">خریدار مشخص نشده</span>'
          }
        </h5>
        <p class="card-text">تاریخ سررسید: ${task.due_date}</p>
      </div>
    </div>
  `).join('');
}

function renderTodayTasks(tasks) {
  const today = new Date().toISOString().split('T')[0];
  const todayTasks = tasks.filter(task => task.start === today);

  if (todayTasks.length) {
    const html = `
      <div class="tasks-section-title">
        <h4 class="mt-4 text-success">کارهای امروز</h4>
      </div>
      ${todayTasks.map(task => `
        <div class="card today-card mb-2" style="max-width:1100px; margin:0 auto;">
          <div class="card-body">
            <h5 class="card-title">${task.title}</h5>
            <p class="card-text">${task.buyer ? task.buyer.username : 'بدون خریدار'}</p>
          </div>
        </div>
      `).join('')}
    `;
    document.getElementById('undone-tasks-container').insertAdjacentHTML('beforebegin', html);
  }
}

function saveTask(taskId) {
  const isDone = document.getElementById(`done-${taskId}`).checked;
  const comment = document.getElementById(`comment-${taskId}`).value;

  fetch(`/TasksManager/update-task/${taskId}/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({ done: isDone, comment: comment })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert('ذخیره شد.');
      location.reload();
    } else {
      alert('خطا در ذخیره.');
    }
  });
}

function getCookie(name) {
  return document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1] || null;
}
</script>

{% endblock %}
